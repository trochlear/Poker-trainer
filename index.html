<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>4-Max Poker Trainer</title>
<style>
html,body{margin:0;min-height:100%;background:#101415;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,"Noto Sans KR",sans-serif}.loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}.loading b{font-size:22px}.loading div{color:#aab7b7;margin-top:8px}
</style>
</head>
<body>
<div class="loading"><section><b>♠ Poker Trainer 불러오는 중…</b><div>레이아웃 v4</div></section></div>
<script>
(async()=>{
  const base='https://raw.githubusercontent.com/trochlear/Poker-trainer/f3569e17c0a7a37ed921441c1d6918d24a86fe8b/index.html';
  try{
    let h=await (await fetch(base,{cache:'no-store'})).text();
    const css=`<style id="v4-layout-fix">
      /* Tablet / desktop: human seat and action bar no longer overlap */
      .seat0{bottom:155px!important;z-index:6!important}
      .actions{bottom:22px!important;z-index:20!important}
      .center{top:22%!important}
      @media(max-width:900px){.table{min-height:800px!important}}
      @media(max-width:620px){
        body{padding-bottom:190px!important}
        .table{min-height:750px!important}
        .seat0{bottom:165px!important}
        .actions{position:fixed!important;left:8px!important;right:8px!important;bottom:8px!important;transform:none!important;width:auto!important;z-index:50!important}
      }
    </style>`;
    const patch=`<script>
      (function(){
        const oldRender=window.render;
        if(typeof oldRender==='function'){
          window.render=function(){
            oldRender();
            try{
              const human=G.players[HUMAN];
              const status=document.getElementById('status');
              if(status && human && human.hole && human.hole.length && !document.getElementById('my-hole-status')){
                status.insertAdjacentHTML('beforeend','<div id="my-hole-status" style="margin-top:9px;padding:7px 10px;border-radius:9px;background:#ffffff12;font-size:17px">🂠 내 패 <b>'+human.hole.map(cardText).join(' ')+'</b></div>');
              } else if(status && human && document.getElementById('my-hole-status')){
                document.getElementById('my-hole-status').innerHTML='🂠 내 패 <b>'+human.hole.map(cardText).join(' ')+'</b>';
              }
            }catch(e){}
          };
          window.render();
        }
      })();
    <\/script>`;
    h=h.replace('</head>',css+'</head>').replace('</body>',patch+'</body>');
    document.open();document.write(h);document.close();
  }catch(e){
    document.body.innerHTML='<div class="loading"><section><b>불러오기 실패</b><div>새로고침해 주세요.</div></section></div>';
  }
})();
</script>
</body>
</html>
