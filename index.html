<style>

-gradient(45deg,#1d4f8e,#1d4f8e 7px,#2b69b3 7px,#2b69b3 14px);border:3px solid white;color:transparent}.seat{position:absolute;width:220px;padding:10px;border-radius:15px;background:#12191bdd;border:1px solid #ffffff18;box-shadow:0 6px 18px #0005}.seat.active-turn{outline:3px solid var(--accent);box-shadow:0 0 0 3px #0003,0 6px 18px #0005}.seat.folded{opacity:.45}.seat0{left:50%;bottom:18px;transform:translateX(-50%)}.seat1{left:18px;top:48%;transform:translateY(-50%)}.seat2{left:50%;top:18px;transform:translateX(-50%)}.seat3{right:18px;top:48%;transform:translateY(-50%)}.seatHead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.nameWrap{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.turnDot{width:11px;height:11px;border-radius:50%;background:transparent;border:1px solid #ffffff30;display:inline-block}.turnDot.on{background:var(--accent);border-color:var(--accent);box-shadow:0 0 10px #f5c451bb}.name{font-weight:900}.style{font-size:11px;color:var(--muted);margin-top:2px}.stack{font-weight:900;color:var(--chip);font-size:20px}.cards{display:flex;gap:5px;margin-top:8px;min-height:48px}.cards .card{width:38px;height:52px;font-size:14px;padding:4px;border-radius:6px}.tag{display:inline-block;font-size:10px;padding:2px 6px;border-radius:999px;background:#ffffff18}.seatStats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.statBox{background:var(--pill);border-radius:9px;padding:6px 8px}.statLabel{font-size:10px;color:var(--muted);margin-bottom:2px}.statVal{font-size:14px;font-weight:900}.actionPill{margin-top:8px;display:inline-block;padding:5px 8px;border-radius:999px;background:#ffffff14;font-size:12px;font-weight:800;color:#d8e3e3;min-height:28px}.actions{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);background:#101719ee;border:1px solid #ffffff1c;border-radius:16px;padding:10px;width:min(650px,90%);display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;box-shadow:0 8px 22px #0007}.actionsTitle{width:100%;text-align:center;font-size:12px;color:#dce5e5;font-weight:900;margin-bottom:2px}.raiseBox{display:flex;gap:6px;align-items:center}.raiseBox input{width:120px;background:#0d1213;color:white;border:1px solid #465153;border-radius:8px;padding:10px}.side{display:flex;flex-direction:column;gap:12px}.panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px}.panel h3{margin:0 0 10px;font-size:15px}.status{font-weight:800;line-height:1.5}.coach{font-size:13px;line-height:1.55;color:#d7e0e0}.log{height:250px;overflow:auto;font-size:12px;line-height:1.55;background:#0f1516;border-radius:9px;padding:10px}.log div{margin-bottom:4px}.small{font-size:12px;color:var(--muted)}.result{font-weight:900;color:var(--ok)}.footerBtns{display:flex;gap:8px}.summaryGrid{display:grid;grid-template-columns:1fr;gap:8px}.summaryItem{display:flex;justify-content:space-between;gap:8px;align-items:center;background:var(--pill);padding:8px 10px;border-radius:10px}.summaryName{font-weight:900}.summaryMeta{font-size:12px;text-align:right}.summaryMeta span{color:#f4d88f;font-weight:900}@media(max-width:900px){.grid{grid-template-columns:1fr}.table{min-height:760px}.side{order:2}.log{height:180px}}@media(max-width:620px){body{padding-bottom:190px}.wrap{padding:8px}.table{min-height:690px;border-width:7px;border-radius:28px}.center{top:18%;width:94%}.turnBanner{font-size:13px;padding:7px 12px}.pot{font-size:20px;margin-bottom:8px}.board{gap:5px;min-height:72px}.card{width:42px;height:60px;font-size:16px;padding:5px}.seat{width:145px;padding:8px}.seat0{bottom:182px}.seat1{left:6px;top:51%}.seat2{top:8px}.seat3{right:6px;top:51%}.name{font-size:13px}.style{font-size:9px}.stack{font-size:14px}.seatStats{gap:5px}.statLabel{font-size:9px}.statVal{font-size:12px}.actionPill{font-size:11px;padding:4px 7px}.cards .card{width:34px;height:46px;font-size:13px}.actions{position:fixed;left:8px;right:8px;bottom:8px;transform:none;width:auto;z-index:50;padding:10px 8px}.raiseBox input{width:105px}.footerBtns{width:100%}.footerBtns button{flex:1}}

<body>
<div class="wrap"><div class="topbar"><div><div class="title">♠ 4-Max Poker Trainer</div><div class="sub">50/100 NLHE · 10,000 시작 · TAG / LAG / Calling Station 봇</div></div><div class="footerBtns"><button id="newGameBtn">새 게임</button><button id="nextHandBtn" class="primary" disabled>다음 핸드</button></div></div><div class="grid"><div class="table" id="table"><div class="seat seat0" id="seat0"></div><div class="seat seat1" id="seat1"></div><div class="seat seat2" id="seat2"></div><div class="seat seat3" id="seat3"></div><div class="center"><div class="turnBanner" id="turnBanner">현재 차례: 준비 중</div><div class="pot" id="pot">Pot 0</div><div class="board" id="board"></div></div><div class="actions" id="actions"><div class="actionsTitle" id="actionsTitle">내 차례가 오면 여기서 선택</div><button id="foldBtn" class="danger">다이</button><button id="checkCallBtn">체크/콜</button><div class="raiseBox"><input id="raiseInput" type="number" min="100" step="50" value="250"><button id="raiseBtn" class="primary">베팅/레이즈</button></div></div></div><div class="side"><div class="panel"><h3>현재 상황</h3><div id="status" class="status">게임 준비 중…</div><div id="streetInfo" class="small"></div></div><div class="panel"><h3>이번 핸드 투자 요약</h3><div class="summaryGrid" id="summaryGrid"></div></div><div class="panel"><h3>즉석 코치</h3><div id="coach" class="coach">액션을 하면 짧게 코멘트해드릴게요.</div></div><div class="panel"><h3>액션 로그</h3><div id="log" class="log"></div></div><div class="panel small">노란 점 + 테두리 = 현재 차례 플레이어<br>모바일에서는 액션창을 아래로 고정했고, 투자 요약은 테이블 밖으로 뺐습니다.</div></div></div></div>
<script>
"use strict";
const SUITS=["♠","♥","♦","♣"],RANKS=["2","3","4","5","6","7","8","9","T","J","Q","K","A"],RANK_VALUE=Object.fromEntries(RANKS.map((r,i)=>[r,i+2])),START_STACK=10000,SB=50,BB=100,HUMAN=0,CAT=["하이카드","원페어","투페어","트립스","스트레이트","플러시","풀하우스","포카드","스트레이트 플러시"],templates=[{name:"나",style:"Human",type:"human"},{name:"Bot A",style:"TAG · 정석형",type:"tag"},{name:"Bot B",style:"LAG · 공격형",type:"lag"},{name:"Bot C",style:"Calling Station · 콜링형",type:"call"}];let G={};
function makeDeck(){const d=[];for(const s of SUITS)for(const r of RANKS)d.push({r,s});return d}function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function cardText(c){return c.r+c.s}function isRed(c){return c.s==="♥"||c.s==="♦"}function combinations(arr,k){const out=[];function rec(start,cur){if(cur.length===k){out.push(cur.slice());return}for(let i=start;i<=arr.length-(k-cur.length);i++){cur.push(arr[i]);rec(i+1,cur);cur.pop()}}rec(0,[]);return out}function straightHigh(vals){const uniq=[...new Set(vals)].sort((a,b)=>b-a);if(uniq.includes(14))uniq.push(1);for(let i=0;i<=uniq.length-5;i++)if(uniq[i]-uniq[i+4]===4)return uniq[i];return 0}function eval5(cs){const vals=cs.map(c=>RANK_VALUE[c.r]).sort((a,b)=>b-a),counts={};for(const v of vals)counts[v]=(counts[v]||0)+1;const groups=Object.entries(counts).map(([v,n])=>({v:+v,n})).sort((a,b)=>b.n-a.n||b.v-a.v),flush=cs.every(c=>c.s===cs[0].s),sh=straightHigh(vals);if(flush&&sh)return[8,sh];if(groups[0].n===4)return[7,groups[0].v,groups[1].v];if(groups[0].n===3&&groups[1].n===2)return[6,groups[0].v,groups[1].v];if(flush)return[5,...vals];if(sh)return[4,sh];if(groups[0].n===3){const ks=groups.filter(g=>g.n===1).map(g=>g.v).sort((a,b)=>b-a);return[3,groups[0].v,...ks]}if(groups[0].n===2&&groups[1].n===2){const hi=Math.max(groups[0].v,groups[1].v),lo=Math.min(groups[0].v,groups[1].v),k=groups.find(g=>g.n===1).v;return[2,hi,lo,k]}if(groups[0].n===2){const ks=groups.filter(g=>g.n===1).map(g=>g.v).sort((a,b)=>b-a);return[1,groups[0].v,...ks]}return[0,...vals]}function cmpScore(a,b){for(let i=0;i<Math.max(a.length,b.length);i++){const x=a[i]||0,y=b[i]||0;if(x!==y)return x-y}return 0}function evalBest(cards){let best=null;for(const c of combinations(cards,5)){const s=eval5(c);if(!best||cmpScore(s,best)>0)best=s}return best}
function freshPlayer(t){return{...t,stack:START_STACK,hole:[],folded:false,allin:false,streetContrib:0,handContrib:0,lastAction:"",seatTag:""}}function living(){return G.players.map((p,i)=>p.stack>0?i:null).filter(x=>x!==null)}function nextAlive(i){for(let k=1;k<=4;k++){const j=(i+k)%4;if(G.players[j].stack>0)return j}return i}function nextInHand(i){for(let k=1;k<=4;k++){const j=(i+k)%4;if(!G.players[j].folded&&!G.players[j].allin&&G.players[j].stack>0)return j}return null}function updatePot(){G.pot=G.players.reduce((s,p)=>s+p.handContrib,0)}function resetGame(){G={players:templates.map(freshPlayer),dealer:3,handNo:0,deck:[],boardAll:[],board:[],street:"idle",currentBet:0,minRaise:BB,pot:0,needs:new Set(),actor:null,handOver:true,reveal:false,sbIndex:null,bbIndex:null,log:[]};newHand()}function positionLabels(){const active=living(),d=G.dealer,sb=nextAlive(d),bb=nextAlive(sb);G.players.forEach(p=>p.seatTag="");G.players[d].seatTag="BTN";G.players[sb].seatTag="SB";G.players[bb].seatTag="BB";const remaining=active.filter(i=>![d,sb,bb].includes(i));if(remaining.length)G.players[remaining[0]].seatTag="CO"}function postBlind(i,amt,label){const p=G.players[i],pay=Math.min(amt,p.stack);p.stack-=pay;p.streetContrib+=pay;p.handContrib+=pay;if(p.stack===0)p.allin=true;p.lastAction=`${label} ${pay}`}function addLog(t){G.log.push(t);render()}
function newHand(){const alive=living();if(alive.length<2){render();return}G.handNo++;G.dealer=nextAlive(G.dealer);G.deck=shuffle(makeDeck());G.boardAll=[];G.board=[];G.street="preflop";G.currentBet=BB;G.minRaise=BB;G.handOver=false;G.reveal=false;G.players.forEach(p=>{p.hole=[];p.folded=p.stack<=0;p.allin=false;p.streetContrib=0;p.handContrib=0;p.lastAction="";p.seatTag=""});positionLabels();let idx=nextAlive(G.dealer);for(let round=0;round<2;round++){for(let c=0;c<alive.length;c++){G.players[idx].hole.push(G.deck.pop());idx=nextAlive(idx)}}for(let i=0;i<5;i++)G.boardAll.push(G.deck.pop());G.sbIndex=nextAlive(G.dealer);G.bbIndex=nextAlive(G.sbIndex);postBlind(G.sbIndex,SB,"SB");postBlind(G.bbIndex,BB,"BB");updatePot();G.needs=new Set(living().filter(i=>!G.players[i].allin));G.actor=nextInHand(G.bbIndex);addLog(`— Hand #${G.handNo} 시작 —`);addLog(`BTN ${G.players[G.dealer].name} · SB ${G.players[G.sbIndex].name} · BB ${G.players[G.bbIndex].name}`);runUntilHuman()}function liveNotFolded(){return G.players.map((p,i)=>!p.folded?i:null).filter(x=>x!==null)}function pay(i,amt){const p=G.players[i],x=Math.min(amt,p.stack);p.stack-=x;p.streetContrib+=x;p.handContrib+=x;if(p.stack===0)p.allin=true;updatePot();return x}function nextActorAfter(i){for(let k=1;k<=4;k++){const j=(i+k)%4;if(G.needs.has(j)&&!G.players[j].folded&&!G.players[j].allin)return j}return null}function removeInvalidNeeds(){for(const i of[...G.needs]){const p=G.players[i];if(p.folded||p.allin||p.stack<=0)G.needs.delete(i)}}
function act(i,kind,toAmount=null){if(G.handOver||i!==G.actor)return;const p=G.players[i],toCall=Math.max(0,G.currentBet-p.streetContrib);let text="";if(kind==="fold"){p.folded=true;G.needs.delete(i);text="다이"}else if(kind==="check"){if(toCall>0)return;G.needs.delete(i);text="체크"}else if(kind==="call"){if(toCall<=0){G.needs.delete(i);text="체크"}else{const got=pay(i,toCall);G.needs.delete(i);text=got<toCall?`올인 콜 ${got}`:`콜 ${got}`}}else if(kind==="raise"){const maxTo=p.streetContrib+p.stack;let target=Math.min(toAmount,maxTo);const minTo=G.currentBet===0?BB:G.currentBet+G.minRaise;if(target<G.currentBet+1)return;if(target<minTo&&target<maxTo)target=minTo;const old=G.currentBet,need=target-p.streetContrib,got=pay(i,need),actualTo=p.streetContrib;if(actualTo<=old){G.needs.delete(i);text=`콜 ${got}`}else{const raiseSize=actualTo-old;if(raiseSize>=G.minRaise)G.minRaise=raiseSize;G.currentBet=actualTo;G.needs=new Set(liveNotFolded().filter(j=>j!==i&&!G.players[j].allin&&G.players[j].stack>0));text=old===0?`베팅 ${actualTo}`:`레이즈 ${actualTo}`}}p.lastAction=text;addLog(`${p.name}: ${text}`);if(i===HUMAN)coachHuman(kind,toAmount,toCall);removeInvalidNeeds();if(liveNotFolded().length===1){finishByFold(liveNotFolded()[0]);return}if(G.needs.size===0){advanceStreet();return}G.actor=nextActorAfter(i);runUntilHuman()}
function advanceStreet(){if(G.handOver)return;if(G.street==="river"){showdown();return}G.players.forEach(p=>{p.streetContrib=0;p.lastAction=""});G.currentBet=0;G.minRaise=BB;if(G.street==="preflop"){G.street="flop";G.board=G.boardAll.slice(0,3)}else if(G.street==="flop"){G.street="turn";G.board=G.boardAll.slice(0,4)}else if(G.street==="turn"){G.street="river";G.board=G.boardAll.slice(0,5)}addLog(`--- ${G.street.toUpperCase()} ${G.board.map(cardText).join(" ")} ---`);const eligible=liveNotFolded().filter(i=>!G.players[i].allin&&G.players[i].stack>0);if(eligible.length===0){runoutAndShowdown();return}G.needs=new Set(eligible);G.actor=nextPostflopActor();runUntilHuman()}function nextPostflopActor(){for(let k=1;k<=4;k++){const j=(G.dealer+k)%4;if(G.needs.has(j))return j}return[...G.needs][0]??null}function runoutAndShowdown(){G.board=G.boardAll.slice();G.street="river";showdown()}function finishByFold(w){updatePot();G.players[w].stack+=G.pot;addLog(`🏆 ${G.players[w].name} 팟 ${G.pot} 획득`);G.players.forEach(p=>{p.handContrib=0;p.streetContrib=0});G.pot=0;G.handOver=true;G.reveal=true;G.actor=null;document.getElementById("coach").innerHTML=`<span class="result">${G.players[w].name} 승리.</span> 모두 폴드했습니다.`;render()}function makeSidePots(){const contribs=G.players.map(p=>p.handContrib),levels=[...new Set(contribs.filter(x=>x>0))].sort((a,b)=>a-b),pots=[];let prev=0;for(const level of levels){const contributors=contribs.map((x,i)=>x>=level?i:null).filter(x=>x!==null),amount=(level-prev)*contributors.length,eligible=contributors.filter(i=>!G.players[i].folded);if(amount>0)pots.push({amount,eligible});prev=level}return pots}
function showdown(){G.board=G.boardAll.slice();G.reveal=true;G.handOver=true;G.actor=null;const scores={};for(const i of liveNotFolded())scores[i]=evalBest([...G.players[i].hole,...G.board]);const pots=makeSidePots();let summary=[];for(const pot of pots){let best=null,winners=[];for(const i of pot.eligible){const s=scores[i];if(!best||cmpScore(s,best)>0){best=s;winners=[i]}else if(cmpScore(s,best)===0)winners.push(i)}const share=Math.floor(pot.amount/winners.length);let rem=pot.amount-share*winners.length;for(const i of winners)G.players[i].stack+=share;let order=[];for(let k=1;k<=4;k++)order.push((G.dealer+k)%4);for(const i of order){if(rem<=0)break;if(winners.includes(i)){G.players[i].stack++;rem--}}summary.push(`${winners.map(i=>G.players[i].name).join(", ")} +${pot.amount}`)}for(const i of liveNotFolded())addLog(`${G.players[i].name}: ${G.players[i].hole.map(cardText).join(" ")} · ${CAT[scores[i][0]]}`);addLog(`🏆 ${summary.join(" / ")}`);G.players.forEach(p=>{p.handContrib=0;p.streetContrib=0});G.pot=0;document.getElementById("coach").innerHTML=`<span class="result">쇼다운 완료.</span> ${summary.join(" · ")}`;render()}
function preflopStrength(hole){const[a,b]=hole,va=RANK_VALUE[a.r],vb=RANK_VALUE[b.r],hi=Math.max(va,vb),lo=Math.min(va,vb),pair=va===vb,suited=a.s===b.s,gap=hi-lo;let s=0;if(pair)s=.45+hi/28;else{s=(hi-2)/12*.35+(lo-2)/12*.12;if(suited)s+=.09;if(gap===1)s+=.07;else if(gap===2)s+=.04;else if(gap>=5)s-=.05;if(hi===14)s+=.10;if(hi>=12&&lo>=10)s+=.10}return Math.max(0,Math.min(1,s))}function postflopStrength(i){const p=G.players[i],cards=[...p.hole,...G.board];if(cards.length<5)return preflopStrength(p.hole);const s=evalBest(cards);let v=s[0]/8,top=s[1]||0;v+=(top-2)/12*.09;const suits={};for(const c of cards)suits[c.s]=(suits[c.s]||0)+1;if(Math.max(...Object.values(suits))===4)v+=.08;const uniq=[...new Set(cards.map(c=>RANK_VALUE[c.r]))];let near=false;for(let start=2;start<=10;start++){const seq=[start,start+1,start+2,start+3,start+4];if(seq.filter(x=>uniq.includes(x)).length===4)near=true}if(near)v+=.06;return Math.max(0,Math.min(1,v))}function rand(){return Math.random()}function botDecision(i){const p=G.players[i],type=p.type,toCall=Math.max(0,G.currentBet-p.streetContrib),pot=G.pot,price=toCall>0?toCall/(pot+toCall):0;let s=G.street==="preflop"?preflopStrength(p.hole):postflopStrength(i);if(p.seatTag==="BTN")s+=.04;if(p.seatTag==="SB")s-=.02;let aggression=.45,looseness=.45,bluff=.08;if(type==="tag"){aggression=.52;looseness=.34;bluff=.05}if(type==="lag"){aggression=.78;looseness=.66;bluff=.17}if(type==="call"){aggression=.25;looseness=.72;bluff=.025}if(toCall===0){let betThreshold=.56-(aggression-.5)*.16;if(s>betThreshold||rand()<bluff*(G.street==="preflop"?.5:1)){const base=G.street==="preflop"?Math.max(BB*2.5,BB):Math.max(BB,Math.round((G.pot*({tag:.5,lag:.65,call:.38}[type]))/50)*50);return{kind:"raise",to:Math.min(p.streetContrib+p.stack,Math.max(base,G.currentBet+G.minRaise))}}return{kind:"check"}}const adjusted=s+(looseness-.5)*.16-price*.45,raiseThreshold=.72-(aggression-.5)*.12;if(adjusted>raiseThreshold&&p.stack>toCall){let target;if(G.street==="preflop")target=Math.round((G.currentBet*(type==="lag"?3.4:3.0))/50)*50;else target=Math.round((G.currentBet+Math.max(G.minRaise,G.pot*(type==="lag"?.6:.45)))/50)*50;target=Math.min(p.streetContrib+p.stack,target);if(target>G.currentBet)return{kind:"raise",to:target}}const callThreshold=.33-(looseness-.5)*.18;if(adjusted>callThreshold||(type==="call"&&rand()<.14))return{kind:"call"};if(type==="lag"&&rand()<bluff&&p.stack>toCall+G.minRaise){const target=Math.min(p.streetContrib+p.stack,G.currentBet+Math.max(G.minRaise,Math.round(G.pot*.55/50)*50));return{kind:"raise",to:target}}return{kind:"fold"}}function runUntilHuman(){render();if(G.handOver)return;if(G.actor===null){advanceStreet();return}if(G.actor===HUMAN){render();return}const d=botDecision(G.actor);setTimeout(()=>{if(!G.handOver&&G.actor!==HUMAN)act(G.actor,d.kind,d.to)},260)}
function coachHuman(kind,toAmount,toCall){const p=G.players[HUMAN],pos=p.seatTag||"";let msg="";if(G.street==="preflop"){const s=preflopStrength(p.hole);if(kind==="fold")msg=s<.35?"깔끔한 폴드입니다. 약한 패를 억지로 끌고 가지 않는 게 중요해요.":"조금 타이트한 폴드예요. 포지션과 상대 성향에 따라 더 넓게 갈 수도 있습니다.";else if(kind==="call")msg=(pos==="BTN"||pos==="CO")?"콜은 가능하지만, 좋은 포지션에선 레이즈로 압박하는 선택도 자주 나옵니다.":"콜했습니다. 포스트플랍에서 먼저 움직이게 되면 약한 원페어에 과투자만 조심하세요.";else if(kind==="raise")msg=`레이즈 좋습니다. ${pos==="BTN"?"버튼 포지션 이점도 같이 활용할 수 있어요.":"상대 범위를 좁히고 주도권을 잡는 선택입니다."}`}else{const s=postflopStrength(HUMAN);if(kind==="fold")msg="이미 넣은 칩은 잊고, 지금 더 넣을 가치가 있는지만 본 폴드입니다.";if(kind==="check")msg=s>.65?"강한 패 체크는 함정이 될 수도 있지만, 상대가 체크백해서 밸류를 놓칠 수도 있습니다.":"체크로 팟을 통제했습니다. 약한 쇼다운 밸류를 억지 블러프로 바꿀 필요는 없어요.";if(kind==="call")msg="콜했습니다. 핵심은 '싸 보여서'가 아니라 팟오즈와 상대 범위입니다.";if(kind==="raise")msg=s>.62?"강한 패로 밸류/보호를 노리는 공격적인 액션입니다.":"블러프/세미블러프 성격이 큽니다. 상대가 접을 만한 더 나은 패가 실제로 있는지 생각해보세요."}document.getElementById("coach").textContent=msg||"액션 처리 완료."}
function cardHTML(c){return`<div class="card ${isRed(c)?"red":""}"><span>${c.r}</span><span>${c.s}</span></div>`}function backHTML(){return`<div class="card back">XX</div>`}function renderSeat(i){const p=G.players[i],el=document.getElementById("seat"+i),show=i===HUMAN||G.reveal,cards=p.hole.length?(show?p.hole.map(cardHTML).join(""):backHTML()+backHTML()):"",turn=!G.handOver&&G.actor===i;el.className=`seat seat${i}${turn?" active-turn":""}${p.folded?" folded":""}`;el.innerHTML=`<div class="seatHead"><div><div class="nameWrap"><span class="turnDot ${turn?"on":""}"></span><span class="name">${p.name}</span><span class="tag">${p.seatTag||""}</span></div><div class="style">${p.style}</div></div><div class="stack">${p.stack.toLocaleString()}</div></div><div class="cards">${cards}</div><div class="seatStats"><div class="statBox"><div class="statLabel">이번 핸드</div><div class="statVal">${p.handContrib.toLocaleString()}</div></div><div class="statBox"><div class="statLabel">이번 스트리트</div><div class="statVal">${p.streetContrib.toLocaleString()}</div></div></div><div class="actionPill">${p.lastAction||"대기"}</div>`}function renderSummary(){document.getElementById("summaryGrid").innerHTML=G.players.map((p,i)=>{const turn=!G.handOver&&G.actor===i?" ▶":"";return`<div class="summaryItem"><div class="summaryName">${p.name}${turn}</div><div class="summaryMeta">핸드 <span>${p.handContrib.toLocaleString()}</span> / 스트리트 <span>${p.streetContrib.toLocaleString()}</span></div></div>`}).join("")}
function render(){for(let i=0;i<4;i++)renderSeat(i);document.getElementById("board").innerHTML=G.board.map(cardHTML).join("");document.getElementById("pot").textContent=`Pot ${G.pot.toLocaleString()}`;renderSummary();const human=G.players[HUMAN],status=document.getElementById("status"),info=document.getElementById("streetInfo"),turnBanner=document.getElementById("turnBanner"),actionsTitle=document.getElementById("actionsTitle");if(G.handOver){status.innerHTML=`Hand #${G.handNo} 종료`;info.textContent="다음 핸드를 누르면 새 핸드가 시작됩니다.";turnBanner.textContent="현재 차례: 핸드 종료";actionsTitle.textContent="핸드 종료"}else{const actorName=G.players[G.actor]?.name||"",toCall=Math.max(0,G.currentBet-human.streetContrib);status.innerHTML=`Hand #${G.handNo} · ${G.street.toUpperCase()}<br>${G.actor===HUMAN?"👉 내 차례":"⏳ "+actorName+" 차례"}`;info.textContent=`현재 베팅 ${G.currentBet.toLocaleString()} · 내 콜 금액 ${G.actor===HUMAN?Math.min(toCall,human.stack).toLocaleString():toCall.toLocaleString()} · 보드 ${G.board.length}장`;turnBanner.textContent=`현재 차례: ${actorName||"준비 중"}`;actionsTitle.textContent=G.actor===HUMAN?"내 차례 · 체크/콜/레이즈 선택":`${actorName} 생각 중…`}const myTurn=!G.handOver&&G.actor===HUMAN;document.getElementById("actions").style.opacity=myTurn?"1":".58";for(const id of["foldBtn","checkCallBtn","raiseBtn","raiseInput"])document.getElementById(id).disabled=!myTurn;if(myTurn){const tc=Math.max(0,G.currentBet-human.streetContrib);document.getElementById("checkCallBtn").textContent=tc===0?"체크":`콜 ${Math.min(tc,human.stack).toLocaleString()}`;const minTo=G.currentBet===0?BB:G.currentBet+G.minRaise,maxTo=human.streetContrib+human.stack,inp=document.getElementById("raiseInput");let suggested=G.street==="preflop"&&G.currentBet<=BB?250:Math.max(minTo,Math.round((G.pot*.5+G.currentBet)/50)*50);suggested=Math.min(suggested,maxTo);if(+inp.value<Math.min(minTo,maxTo)||+inp.value>maxTo)inp.value=suggested;inp.min=Math.min(minTo,maxTo);inp.max=maxTo;document.getElementById("raiseBtn").textContent=G.currentBet===0?"베팅":"레이즈"}document.getElementById("nextHandBtn").disabled=!G.handOver||living().length<2;const log=document.getElementById("log");log.innerHTML=G.log.map(x=>`<div>${x}</div>`).join("");log.scrollTop=log.scrollHeight}
document.getElementById("foldBtn").onclick=()=>act(HUMAN,"fold");document.getElementById("checkCallBtn").onclick=()=>{const p=G.players[HUMAN],tc=Math.max(0,G.currentBet-p.streetContrib);act(HUMAN,tc===0?"check":"call")};document.getElementById("raiseBtn").onclick=()=>{const v=parseInt(document.getElementById("raiseInput").value,10);if(Number.isFinite(v))act(HUMAN,"raise",v)};document.getElementById("nextHandBtn").onclick=()=>newHand();document.getElementById("newGameBtn").onclick=()=>{if(confirm("스택을 10,000씩 초기화하고 새 게임을 시작할까요?"))resetGame()};resetGame();
</script></body></html>
